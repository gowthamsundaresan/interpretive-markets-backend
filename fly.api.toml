app = "interpretive-api"
primary_region = "ams"

[build]
dockerfile = "Dockerfile-API"

[env]
SERVER_PORT = "3000"
SERVER_HOST = "0.0.0.0"
CORS_ORIGIN = "*"
LOG_LEVEL = "info"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1
